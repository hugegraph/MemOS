name: Dashboard checks
on:
  push:
    branches: [dashboard]
  pull_request:
    branches: [dashboard]
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node scripts/issue-acceptance/verify-frontend-unchanged.ts
      - run: node --test server/live/*.test.ts scripts/mock-api.test.ts scripts/acceptance.test.ts scripts/issue-acceptance/isolated/*.test.ts scripts/issue-acceptance/contract/*.test.ts scripts/issue-acceptance/real/*.test.ts
      - run: npx --yes @redocly/cli@2.67.1 lint openapi.json
