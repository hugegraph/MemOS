        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '502':
          $ref: '#/components/responses/ErrorBadGateway'
        '503':
          $ref: '#/components/responses/ErrorUnavailable'
        '200':
          $ref: '#/components/responses/PromptList'
  /api/dashboard/prompts/detail:
    post:
      tags:
        - 提示词工作台
      summary: 单条提示词详情
      description: 返回注册项全文（`inputSchema`、`sampleInputs[].input` 原样透传）、各语言内置默认与当前生效值。
      requestBody:
        required: true
        content:
          application/json:
