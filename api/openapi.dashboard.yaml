components:
  schemas:
    SkillExperimentSummary:
      type: object
      required:
      - experimentId
      - skillId
      - revision
      - manifestHash
      - status
      - planned
      - completed
      properties:
        experimentId: &id001
          type: string
        skillId: *id001
        revision: *id001
        manifestHash: *id001
        status:
          type: string
          enum:
          - frozen
          - running
          - completed
          - interrupted
        planned: &id002
          type: integer
          minimum: 0
        completed: *id002
    SkillExperimentRow:
      type: object
      required:
      - cellId
      - caseId
      - group
      - status
      - assessmentKind
      - repairPass
      - boundaryPass
      - branchSupported
      - criticalViolation
      - manualReview
      - taskAccepted
      - receiptVerified
      - loading
      - capture
      - elapsedSeconds
      - reportedCostUsd
      - toolCalls
      - failureReasons
      properties:
        cellId: *id001
        caseId: *id001
        group: &id005
          type: string
          enum:
          - none
          - raw_memory
          - skill
        status:
          type: string
          enum:
          - queued
          - running
          - passed
          - failed
          - unknown
          - infra_invalid
        assessmentKind:
          type: string
          enum:
          - repair
          - boundary_repair
          - manual_boundary
        repairPass:
          type: integer
          enum:
          - 0
          - 1
          nullable: true
        boundaryPass:
          type: integer
          enum:
          - 0
          - 1
          nullable: true
        branchSupported:
          type: boolean
          nullable: true
        criticalViolation:
          type: boolean
          nullable: true
        manualReview:
          type: string
          enum:
          - pending
        taskAccepted: &id003
          type: boolean
        receiptVerified: *id003
        loading: *id001
        capture: *id001
        elapsedSeconds: &id004
          type: number
          minimum: 0
          nullable: true
        reportedCostUsd: *id004
        toolCalls:
          type: integer
          minimum: 0
          nullable: true
        failureReasons:
          type: array
          items: *id001
    SkillExperimentGroupScore:
      type: object
      required:
      - group
      - primaryRepair
      - boundary
      - unknown
      - infraInvalid
      - elapsedSeconds
      - reportedCostUsd
      - costUnknown
      properties:
        group: *id005
        primaryRepair:
          type: object
          required:
          - passed
          - denominator
          - planned
          properties:
            passed: *id002
            denominator: *id002
            planned: *id002
        boundary:
          type: object
          required:
          - taskSolved
          - planned
          - pendingReview
          properties:
            taskSolved: *id002
            planned: *id002
            pendingReview: *id002
        unknown: *id002
        infraInvalid: *id002
        elapsedSeconds: *id004
        reportedCostUsd: *id004
        costUnknown: *id002
    SkillExperimentDetail:
      allOf:
      - $ref: '#/components/schemas/SkillExperimentSummary'
      - type: object
        required:
        - groups
        - budget
        - rows
        - summary
        - publication
        - limitations
        properties:
          groups:
