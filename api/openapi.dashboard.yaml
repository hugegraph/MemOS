                - type: object
                  required:
                    - messages
                  properties:
                    messages:
                      type: array
                      items:
                        type: object
                        required:
                          - role
                          - content
                        properties:
                          role:
                            type: string
                            enum:
                              - system
                              - user
                              - assistant
                          content:
                            type: string
                    extractionTypes:
                      type: array
                      items:
                        $ref: '#/components/schemas/MemoryDetailType'
      responses:
        '200':
          $ref: '#/components/responses/ExtractDebug'
  /api/dashboard/prompts/list:
    post:
      tags:
        - 提示词工作台
