        - keyPrefix
        - tools
      properties:
        mode:
          type: string
          enum:
            - sample
            - live
          description: '`sample` 示例后端，`live` 真实后端'
        service:
          type: string
        health:
          type: object
          nullable: true
        keyPrefix:
          type: string
          description: 新建密钥的展示与校验用它
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolInfo'
    ProjectScopedRequest:
      type: object
      properties:
