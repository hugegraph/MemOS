openapi: 3.0.3
info:
  title: Memory Console Dashboard API
  version: 0.1.0
  description: |-
    控制台前端依赖的后端接口定义。

    ## 通用约定

    **统一返回格式。** 所有接口返回 `{ code, data, message }`。`code === 0` 表示成功，前端解包后只拿 `data`；非 0 时前端按错误处理，把 `message` 弹成提示。HTTP 状态码不参与判断，200 + 非 0 code 也算失败。

    **请求体。** 除少数 GET 外，参数一律放 body，不放 query。字段值为空串或 null 时前端会**删掉该字段**再发出去，后端要按「字段不存在」处理，不要依赖空串。

    **分页。** 参数名固定 `pageNum` / `pageSize`，从 1 开始。

    **列表响应的键不统一。** 同一个前端里四种写法并存，这是最容易被忽略的地方：

    | 接口 | 列表键 | 分页字段 |
    |---|---|---|
    | `project/list`、`keys/list`、`knowledgebase/list`、`knowledgebase/memory/list` | `records` | `total` |
    | `log/list` | `logs` | `total` |
    | `project/memory/list` | `memListItemResponseList` | `total`、`current` |
    | `profileTemplate/list` | `list` | `total`、`current`、`size`、`pages` |

    **时间字段。** 一律叫 `createTime`（不是 `createdAt`），值是可被 `dayjs` 直接解析的字符串。

    ## 错误码

    | code | 含义 |
    |---|---|
    | 0 | 成功 |
    | 40000 | 参数错误 |
    | 40001 | 资源不存在 |
    | 40002 | 请求过于频繁 |
    | 40003 | 无权限 |
    | 40100 | 未登录 |
    | 40104 | 未授权 |
    | 50106 | 知识库数量超限 |
    | 50107 | 文档删除中 |
    | 41300 | 请求体或正文超过上限 |
    | 50200 | 模型调用失败，稍后重试 |
    | 50400 | 模型响应超时，稍后重试 |
    | 60004 | 容量超限 |

    ## 模型列表不走接口

    「模型列表」页的数据来自静态 JSON（形状 `{ records: [...] }`），由前端从配置目录取，后端不需要实现。

    ## 鉴权

    **控制台目前不发任何鉴权头**，请求里只有 `Content-Type`。所以本接口定义按「无鉴权」描述（根级 `security: []`）。

    真实后端要不要加鉴权、加在哪一层需要单独决定：控制台没有登录页，后端若要求 token，前端也要相应改动。
security: []
servers:
  - url: http://localhost:5280
    description: 控制台进程（与对外 /memory/* 同一个二进制，5280 端口）
tags:
  - name: Skill 管理
    description: 固定版本候选、隔离评测、人工审阅发布与加载准入。
  - name: 项目
    description: 工作区。几乎所有业务接口都要它的 id。
  - name: 接口密钥
    description: 密钥的增删查与复制。
  - name: 调用日志
    description: 调用流水与单条详情。
  - name: 记忆
    description: 记忆的列表、详情与删除。
  - name: 知识库
    description: 知识库及其文档、记忆。
  - name: 属性树模板
    description: 属性树模板的增删改查。
  - name: 自定义抽取
    description: 抽取 Prompt 的读写与调试。
  - name: 提示词工作台
    description: 项目级提示词的清单、版本、校验与试跑；控制面只代理，不保存正文。
  - name: 用量
    description: 按天聚合的调用用量。
  - name: 账号
    description: 额度与订阅。
  - name: 图谱
    description: 记忆图谱：按项目取节点、边与统计。
  - name: 运行信息
    description: 控制台自身的运行状态。
paths:

  /api/dashboard/project/dict:
    get:
      tags:
        - 项目
      summary: 项目下拉字典
      description: 返回**数组**，不是分页对象。`status === "ENABLED"` 的那条是当前项目。
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
            example: zh-CN
      responses:
        '200':
          $ref: '#/components/responses/ProjectDict'
  /api/dashboard/project/list:
    post:
      tags:
        - 项目
      summary: 项目分页列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pageNum:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 10
      responses:
        '200':
          $ref: '#/components/responses/ProjectRecords'
  /api/dashboard/project/create:
    post:
      tags:
        - 项目
      summary: 新建项目
      description: 返回新建的项目对象，前端拿它的 `id` 立刻切过去。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                description:
                  type: string
                isMultiView:
                  type: integer
                  enum:
                    - 0
                    - 1
      responses:
        '200':
          $ref: '#/components/responses/Project'
  /api/dashboard/project/update:
    post:
      tags:
        - 项目
      summary: 更新项目 / 切换当前项目
      description: '切换当前项目就是传 `{ id, status: "ENABLED" }`，后端要把其它项目置回 `DISABLED`。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Project'
                - type: object
                  properties:
                    id:
                      type: string
                    status:
                      type: string
                      enum:
                        - ENABLED
                        - DISABLED
                  required:
                    - id
      responses:
        '200':
          $ref: '#/components/responses/Project'
  /api/dashboard/project/revoke/{id}:
    post:
      tags:
        - 项目
      summary: 删除项目
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/project/delete/{id}:
    post:
      tags:
        - 项目
      summary: 归档项目（软删除）
      description: 成员、邀请与 API Key 全部保留，之后可用 `project/restore/{id}` 原样恢复。个人项目不能归档。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功，项目已归档
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          id:
                            type: string
                          archived:
                            type: boolean
  /api/dashboard/project/restore/{id}:
    post:
      tags:
        - 项目
      summary: 恢复归档项目
      description: 只有项目所有者或平台管理员可以恢复。恢复后成员与 API Key 立即恢复可用。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Project'
  /api/dashboard/keys/list:
    post:
      tags:
        - 接口密钥
      summary: 密钥分页列表
      description: 列表里下发的 `apiKey` 就是**完整密钥**，没有掩码字段，前端自己截断成 `${key.slice(0,7)}*******${key.slice(-8)}` 展示。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
              properties:
                projectId:
                  type: string
                pageNum:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 10
      responses:
        '200':
          $ref: '#/components/responses/ApiKeyRecords'
  /api/dashboard/keys/create:
    post:
      tags:
        - 接口密钥
      summary: 新建密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - keyName
              properties:
                projectId:
                  type: string
                keyName:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/ApiKey'
  /api/dashboard/keys/revoke/{apiKeyId}:
    post:
      tags:
        - 接口密钥
      summary: 吊销密钥
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/dashboard/keys/rename/{apiKeyId}:
    post:
      tags:
        - 接口密钥
      summary: 修改 Key 的名称
      description: 只改展示名，明文与哈希不变，改名后 Key 仍然可用。
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - keyName
              properties:
                keyName:
                  type: string
                  maxLength: 64
      responses:
        '200':
          $ref: '#/components/responses/ApiKey'
  /api/dashboard/keys/copy:
    post:
      tags:
        - 接口密钥
      summary: 取完整密钥
      description: '`data` 是密钥字符串本身，不是对象。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiKeyId
              properties:
                apiKeyId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/StringData'
  /api/dashboard/log/list:
    post:
      tags:
        - 调用日志
      summary: 调用日志分页列表
      description: |-
        `pageSize` 默认 50，前端只渲染返回结果的前 100 条。

        `subjectType` 取 `all` / `user` / `agent`；`subjectId` 为空时 `subjectType` 会被强制清空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
              properties:
                projectId:
                  type: string
                pageNum:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 50
                subjectId:
                  type: string
                subjectType:
                  type: string
                  enum:
                    - all
                    - user
                    - agent
                eventType:
                  $ref: '#/components/schemas/EventType'
                query:
                  type: string
                status:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/LogList'
  /api/dashboard/log/detail:
    post:
      tags:
        - 调用日志
      summary: 调用日志详情
      description: |-
        `requestBody` 与 `responseBody` 是 **JSON 字符串**，不是对象，前端要二次 `JSON.parse`。

        `eventType === "chat"` 时 `responseBody` 再解析一次：解析结果带 `code` 与 `data` 就直接用，否则包成 `{ code: responseCode, data: <解析结果> }`。

        ### 详情抽屉按 eventType 取哪些字段

        通用字段（每条日志都有）：`status`、`duration`、`traceId`、`userId`、`agentId`、`createTime`、`requestTokens`、`responseTokens`、`requestCode`、`responseCode`、`eventType`。

        各类型额外读取的路径（点号分隔，`requestBody` / `responseBody` 解析后的字段）：

        | eventType | 请求 | 响应 |
        |---|---|---|
        | `addMessage` | `async_mode` `conversation_id` `allow_memory_view` `messages` `info` | `code` `data.memory_views` `message` |
        | `addFeedback` | `feedback_target` `profile_id` `attr_id` `feedback_content` `feedback_time` | `code` `data.memory_views` `message` |
        | `searchMemory` | `conversation_id` `conversationId` `query` `include_memory_view` `memory_limit_number` `includePreference` `preferenceLimitNumber` `includeToolMemory` `toolMemoryLimitNumber` `knowledgebase_ids` `filter` | `code` `data` `message` |
        | `getMessage` | `message_limit_number` | `code` `data.message_detail_list` `message` |
        | `getMemory` | `page` `size` `filter` `include_memory_view` | `code` `data` `message` |
        | `deleteMemory` | `memory_ids` `message_id` | `code` `data` `message` |
        | `manualAddMemory` | `memory_view` `add_time` `algorithm_updatable` `content` | `code` `data` `message` |
        | `updateMemory` | `memory_id` `title` `algorithm_updatable` `content` | `code` `data` `message` |
        | `bindProfileTemplate` | `bind_list` | `code` `message` |
        | `editProfile` | `profile_template_id` `metadata` `remove_fields` | `code` `message` |
        | `deleteProfile` | `profile_template_id` | `code` `message` |
        | `chat` | `conversation_id` `knowledgebase_ids` `query` `filter` `base_prompt` `model_name` `include_preference` `add_message_on_answer` | `code` `data.response` `message` |
        | `extractMemory` | `messages` `extraction_types` | `code` `message`、`data.choices.0.message.content` |
        | `rerank` | `model` `query` `documents` `top_n` | `code` `data.results` `message` |

        请求体里的键名风格不统一，既有下划线（`conversation_id`）也有驼峰（`conversationId`），`searchMemory` 两种都会去取。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - logId
              properties:
                logId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/LogDetail'
  /api/dashboard/project/memory/list:
    post:
      tags:
        - 记忆
      summary: 记忆分页列表
      description: |-
        列表键是 `memListItemResponseList`，不是 `records`。

        `memoryDetailType` 决定返回哪一类记忆，取值见 `MemoryDetailType`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - memoryDetailType
              properties:
                projectId:
                  type: string
                memoryDetailType:
                  $ref: '#/components/schemas/MemoryDetailType'
                pageNum:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 50
                knowledgeBaseId:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
                externalUserId:
                  type: string
                subjectType:
                  $ref: '#/components/schemas/MemorySubjectType'
                memSearchContent:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MemoryList'
  /api/dashboard/project/memory/detail:
    post:
      tags:
        - 记忆
      summary: 记忆详情
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - memoryId
                - memType
              properties:
                projectId:
                  type: string
                memoryId:
                  type: string
                memType:
                  $ref: '#/components/schemas/MemoryDetailType'
      responses:
        '200':
          $ref: '#/components/responses/Memory'
  /api/dashboard/project/memory/events:
    post:
      tags: [记忆]
      summary: 查询不可变的记忆操作事件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
                after:
                  type: string
                  maxLength: 512
                  description: 当前项目的opaque游标，省略时返回最近50条
                callIds:
                  type: array
                  maxItems: 20
                  description: 按真实调用标识读取历史快照，与after互斥，不移动feed游标
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
      responses:
        '200':
          description: 按项目返回真实召回、新增、更新和删除快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [records, cursor, hasMore, total]
                        properties:
                          records:
                            type: array
                            items:
                              $ref: '#/components/schemas/MemoryEvent'
                          cursor:
                            type: string
                          hasMore:
                            type: boolean
                          total:
                            type: integer
  /api/dashboard/project/memory/activity:
    post:
      tags: [记忆]
      summary: 查询写入后的真实记忆结果
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId:
                  type: string
                callIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 128
                after:
                  type: string
                  description: 不传 callIds 时增量读取最近完成记录的时间游标
      responses:
        '200':
          description: 按项目返回真实写入结果，旧记录未保留结果时为 unavailable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items:
                              $ref: '#/components/schemas/MemoryActivity'
                          total:
                            type: integer
                          cursor:
                            type: string
  /api/dashboard/project/memory/delete:
    post:
      tags:
        - 记忆
      summary: 批量删除记忆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memory_ids
              properties:
                memory_ids:
                  type: array
                  items:
                    type: string
                memType:
                  $ref: '#/components/schemas/MemoryDetailType'
      responses:
        '200':
          $ref: '#/components/responses/DeleteResult'
  /api/dashboard/graph/memories:
    get:
      tags:
        - 图谱
      summary: 记忆图谱的节点与边
      parameters:
        - name: tenant
          in: query
          required: true
          schema:
            type: string
          description: 项目 id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: 节点上限，超过服务端配置的上限时按上限截断
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔的记忆类型过滤
      responses:
        '200':
          $ref: '#/components/responses/GraphPage'
  /api/dashboard/graph/memory:
    get:
      tags:
        - 图谱
      summary: 单个节点的正文
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: tenant
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          memory:
                            type: string
  /api/dashboard/knowledgebase/list:
    post:
      tags:
        - 知识库
      summary: 知识库分页列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pageNum:
                  type: integer
                  default: 1
                pageSize:
                  type: integer
                  default: 10
                name:
                  type: string
                projectId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBaseRecords'
  /api/dashboard/knowledgebase/create:
    post:
      tags:
        - 知识库
      summary: 新建知识库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - knowledgebaseName
              properties:
                knowledgebaseName:
                  type: string
                knowledgebaseDescription:
                  type: string
                projectIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBase'
  /api/dashboard/knowledgebase/update:
    post:
      tags:
        - 知识库
      summary: 更新知识库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                knowledgebaseName:
                  type: string
                knowledgebaseDescription:
                  type: string
                projectIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBase'
  /api/dashboard/knowledgebase/delete:
    post:
      tags:
        - 知识库
      summary: 删除知识库
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - knowledgeBaseId
              properties:
                projectId:
                  type: string
                knowledgeBaseId:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          id:
                            type: string
  /api/dashboard/knowledgebase/detail:
    post:
      tags:
        - 知识库
      summary: 知识库详情
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - knowledgeBaseId
              properties:
                knowledgeBaseId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBase'
