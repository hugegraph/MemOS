              properties:
                projectId:
                  type: string
                  description: 传 "all" 表示全部
                apiKeyId:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                includeDailyDetails:
                  type: boolean
                  default: true
      responses:
        '200':
          $ref: '#/components/responses/UsageQuery'
